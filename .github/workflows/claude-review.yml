name: Claude review

# Review automatica all'apertura della PR; per rivederla dopo nuovi push: "@claude rivedi".
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Fai la code review di questa PR. Segui CLAUDE.md e README.md: scope della POC,
            principi non negoziabili, contratto in shared/schemas/, privacy dei dati.
            Segnala solo problemi reali (bug, sicurezza, rotture del contratto, scope allargato),
            non preferenze di stile. Commenti inline sulle righe interessate, poi un commento
            di sintesi breve sulla PR. Scrivi in italiano.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
